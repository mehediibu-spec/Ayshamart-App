name: Build Android APK

# Builds a testable debug APK on every push to this branch (and on-demand via
# the "Run workflow" button). Download it from the run's "Artifacts" section —
# no local Flutter install needed.
on:
  push:
    branches:
      - "claude/**"
      - main
  workflow_dispatch:
    inputs:
      build_mode:
        description: "Build mode"
        type: choice
        default: debug
        options: [debug, release]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      # The repo holds Dart source + config; generate the platform folders
      # (android/) here. This does NOT overwrite anything under lib/.
      - name: Generate Android platform files
        run: flutter create --org com.ayshamart --project-name ayshamart_app --platforms=android .

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations (bn/en)
        run: flutter gen-l10n || true

      - name: Analyze (non-blocking)
        run: flutter analyze || true

      # Demo data renders without keys. To build against the live store, add
      # repo secrets WC_CONSUMER_KEY / WC_CONSUMER_SECRET and they'll be injected.
      - name: Build APK
        run: |
          MODE="${{ github.event.inputs.build_mode || 'debug' }}"
          flutter build apk --"$MODE" \
            --dart-define=WC_BASE_URL=https://ayshamart.com \
            --dart-define=WC_CONSUMER_KEY=${{ secrets.WC_CONSUMER_KEY }} \
            --dart-define=WC_CONSUMER_SECRET=${{ secrets.WC_CONSUMER_SECRET }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ayshamart-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14
