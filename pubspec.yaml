name: ayshamart_app
description: Ayshamart — Premium mobile & gadget retail store for Bangladesh (WooCommerce powered).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ---- State management ----
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # ---- Networking ----
  dio: ^5.5.0
  pretty_dio_logger: ^1.4.0
  connectivity_plus: ^6.0.3

  # ---- Local storage / secure auth ----
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # ---- UI / UX ----
  cached_network_image: ^3.3.1
  carousel_slider: ^4.2.1
  shimmer: ^3.0.0
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.2.1
  smooth_page_indicator: ^1.1.0
  pull_to_refresh_flutter3: ^2.0.2
  flutter_staggered_grid_view: ^0.7.0

  # ---- Routing ----
  go_router: ^14.2.0

  # ---- Localization & formatting ----
  # Must track the version flutter_localizations pins on the current Flutter
  # stable channel (0.20.x), otherwise pub version solving fails.
  intl: ^0.20.2

  # ---- Webview (for hosted checkout: SSLCommerz / bKash) ----
  webview_flutter: ^4.8.0

  # ---- Push notifications ----
  firebase_core: ^3.1.0
  firebase_messaging: ^15.0.0
  flutter_local_notifications: ^17.1.2

  # ---- Misc ----
  url_launcher: ^6.3.0
  equatable: ^2.0.5
  logger: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.0
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/

  # Professional Bengali typography is provided at runtime by the `google_fonts`
  # package (Hind Siliguri — full Bengali coverage + correct ৳ glyph), so no TTFs
  # need to be bundled to build/run.
  #
  # For PRODUCTION (offline-safe, no first-run network fetch) bundle the TTFs and
  # re-enable this block — drop HindSiliguri-{Regular,Medium,SemiBold,Bold}.ttf
  # into assets/fonts/ (see docs/SETUP.md §5):
  #
  # fonts:
  #   - family: HindSiliguri
  #     fonts:
  #       - asset: assets/fonts/HindSiliguri-Regular.ttf
  #         weight: 400
  #       - asset: assets/fonts/HindSiliguri-Bold.ttf
  #         weight: 700
